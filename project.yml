# Xcode project configuration. Managed by https://github.com/yonaskolb/XcodeGen
# Xcode is only used to build the release App Bundle. Debug builds only use Swift Package Manager

name: WinMux

packages:
  WinMuxPackage:
    path: .

configs:
  Debug: debug
  Release: release

targets:
  WinMux:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    info:
      path: resources/WinMux-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        SUEnableAutomaticChecks: true
        SUFeedURL: https://github.com/ZimengXiong/winmux/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
    sources:
      - "Sources/WinMuxApp"
      - path: "resources"
        excludes:
          - "marketing"
          - "screenshots"
      # The Nickel library a config imports as winmux/winmux.ncl and winmux/defaults.ncl.
      # It lands in Contents/Resources/nickel, where winmux-nickel looks for it.
      - path: "nickel-helper/nickel"
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Build, embed and sign winmux-nickel
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # Xcode runs scripts with a minimal PATH that has no cargo on it.
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/mise/shims:/opt/homebrew/bin:/usr/local/bin:$PATH"
          cargo build --release --manifest-path "$SRCROOT/nickel-helper/Cargo.toml"
          helpers="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$helpers"
          cp "$SRCROOT/nickel-helper/target/release/winmux-nickel" "$helpers/winmux-nickel"
          # Signed with the app's identity before Xcode seals the bundle. It needs no entitlements.
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --options runtime "$helpers/winmux-nickel"
    dependencies:
      - package: WinMuxPackage
        product: AppBundle
      - package: WinMuxPackage
        product: SparkleSupport
    # https://developer.apple.com/documentation/xcode/build-settings-reference
    settings:
      base:
        SWIFT_VERSION: 6.2 # Swift Language Version
        ENABLE_USER_SCRIPT_SANDBOXING: NO # The script phase runs cargo
        MARKETING_VERSION: ${XCODEGEN_WINMUX_VERSION}
        CURRENT_PROJECT_VERSION: ${XCODEGEN_WINMUX_VERSION}
        SPARKLE_PUBLIC_KEY: ${XCODEGEN_WINMUX_SPARKLE_PUBLIC_KEY}
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ${XCODEGEN_WINMUX_CODE_SIGN_IDENTITY}
        DEVELOPMENT_TEAM: ${XCODEGEN_WINMUX_DEVELOPMENT_TEAM}
      configs:
        Debug:
          PRODUCT_NAME: WinMux-Debug
          PRODUCT_BUNDLE_IDENTIFIER: com.zimengxiong.winmux.debug
        Release:
          PRODUCT_NAME: WinMux
          PRODUCT_BUNDLE_IDENTIFIER: com.zimengxiong.winmux
          ENABLE_HARDENED_RUNTIME: YES
          SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
          GCC_TREAT_WARNINGS_AS_ERRORS: YES
    entitlements:
      path: resources/WinMux.entitlements
      properties:
        # Accessibility API doesn't work in sandboxed apps
        com.apple.security.app-sandbox: false
