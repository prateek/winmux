config-version = 2
auto-reload-config = true
persistent-workspaces = []

[workspace-sidebar]
enabled = true
width = 280
collapsed-width = 64
show-date = false

[[zone-layouts]]
id = 'balanced'
layout = 'columns'
default-zone = 'main'
columns = [
  { id = 'left', name = 'Reference', width = 0.25 },
  { id = 'main', name = 'Work', width = 0.50 },
  { id = 'right', name = 'Comms', width = 0.25 },
]

[[zones]]
monitor = 1
layout-preset = 'balanced'

[[zone-bindings]]
zone = 'left'
workspace = 'reference'

[[zone-bindings]]
zone = 'main'
workspace = 'work'

[[zone-bindings]]
zone = 'right'
workspace = 'comms'

[[zone-affinities]]
zone = 'Comms'
if.app-id = 'com.apple.mail'
if.window-title-regex-substring = 'Inbox|Mail'
fail-if-noop = false

[[zone-affinities]]
zone = 'Comms'
if.window-title-regex-substring = 'Slack|Messages'
fail-if-noop = false

[[zone-affinities]]
zone = 'Reference'
if.app-name-regex-substring = 'Preview|Safari'
if.window-title-regex-substring = 'Docs|Reference'
fail-if-noop = false

[mode.main.binding]
alt-z = 'mode zone'
alt-r = 'focus-zone Reference'
alt-w = 'focus-zone Work'
alt-c = 'focus-zone Comms'

[mode.zone.binding]
esc = 'mode main'
h = ['focus-zone prev', 'mode main']
l = ['focus-zone next', 'mode main']
shift-h = ['move-node-to-zone --focus-follows-window prev', 'mode main']
shift-l = ['move-node-to-zone --focus-follows-window next', 'mode main']
