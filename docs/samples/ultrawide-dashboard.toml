config-version = 2
auto-reload-config = true
persistent-workspaces = []

[workspace-sidebar]
enabled = true
width = 300
collapsed-width = 64
show-date = true

[[zone-layouts]]
id = 'dashboard'
layout = 'columns'
default-zone = 'main'
columns = [
  { id = 'left', name = 'Reference', width = 0.20 },
  { id = 'main', name = 'Work', width = 0.45 },
  { id = 'right', name = 'Comms', width = 0.20 },
  { id = 'dashboard', name = 'Dashboard', width = 0.15 },
]

[[zones]]
monitor = 1
layout-preset = 'dashboard'

[[zone-scenes]]
id = 'dashboard-open'
layout-preset = 'dashboard'
workspaces = [
  { zone = 'left', workspace = 'Reference' },
  { zone = 'main', workspace = 'Work' },
  { zone = 'right', workspace = 'Comms' },
  { zone = 'dashboard', workspace = 'Dash' },
]

[[zone-availability-sets]]
id = 'work-only'
enabled-zones = ['main']

[[zone-availability-sets]]
id = 'dashboard'
enabled-zones = ['left', 'main', 'right', 'dashboard']

[mode.main.binding]
alt-z = 'mode zone'
alt-d = 'use-zone-scene dashboard-open'
alt-f = 'use-zone-profile work-only'

[mode.zone.binding]
esc = 'mode main'
d = ['use-zone-scene dashboard-open', 'mode main']
a = ['cycle-zone-profile work-only dashboard', 'mode main']
