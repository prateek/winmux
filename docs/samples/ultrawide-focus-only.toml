config-version = 2
auto-reload-config = true
persistent-workspaces = []

[workspace-sidebar]
enabled = true
width = 260
collapsed-width = 64
show-date = false

[[zone-layouts]]
id = 'balanced'
layout = 'columns'
default-zone = 'main'
columns = [
  { id = 'left', name = 'Reference', width = 0.25 },
  { id = 'main', name = 'Work', width = 0.50 },
  { id = 'right', name = 'Comms', width = 0.25 },
]

[[zone-layouts]]
id = 'focus'
layout = 'columns'
default-zone = 'main'
columns = [
  { id = 'left', name = 'Reference', width = 0.15 },
  { id = 'main', name = 'Work', width = 0.70 },
  { id = 'right', name = 'Comms', width = 0.15 },
]

[[zones]]
monitor = 1
layout-preset = 'balanced'

[[zone-availability-sets]]
id = 'focus-only'
enabled-zones = ['main']

[[zone-availability-sets]]
id = 'full-dashboard'
enabled-zones = ['left', 'main', 'right']

[mode.main.binding]
alt-z = 'mode zone'
alt-f = 'use-zone-profile focus-only'
alt-d = 'use-zone-profile full-dashboard'

[mode.zone.binding]
esc = 'mode main'
tab = ['cycle-zone-layout balanced focus', 'mode main']
a = ['cycle-zone-profile focus-only full-dashboard', 'mode main']
t = ['toggle-zone current', 'mode main']
