config-version = 2
auto-reload-config = false
persistent-workspaces = []

[[zones]]
monitor = 1
layout = 'columns'
default-zone = 'main'
columns = [
  { id = 'left', name = 'Reference', width = 0.25 },
  { id = 'main', name = 'Work', width = 0.50 },
  { id = 'right', name = 'Comms', width = 0.25 },
]

[workspace-sidebar]
enabled = true
enable-focus = false
width = 240
collapsed-width = 64
show-date = false

[mode.main.binding]
alt-c = 'toggle-zone Comms'
alt-shift-c = 'enable-zone Comms'
alt-ctrl-c = 'disable-zone Comms'
