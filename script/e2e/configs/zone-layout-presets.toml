config-version = 2
auto-reload-config = false
persistent-workspaces = []

[[zone-layouts]]
id = 'balanced'
layout = 'columns'
default-zone = 'main'
columns = [
  { id = 'left', name = 'Reference', width = 0.30 },
  { id = 'main', name = 'Work', width = 0.40 },
  { id = 'right', name = 'Comms', width = 0.30 },
]

[[zone-layouts]]
id = 'focus'
layout = 'columns'
default-zone = 'main'
columns = [
  { id = 'left', name = 'Reference', width = 0.18 },
  { id = 'main', name = 'Work', width = 0.64 },
  { id = 'right', name = 'Comms', width = 0.18 },
]

[[zones]]
monitor = 1
layout-preset = 'balanced'

[workspace-sidebar]
enabled = false

[mode.main.binding]
alt-1 = 'use-zone-layout balanced'
alt-2 = 'use-zone-layout focus'
