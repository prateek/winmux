config-version = 2
auto-reload-config = false
persistent-workspaces = []

[[zone-styles]]
id = 'urgent'
color = '#D3455B'

[[zone-layouts]]
id = 'balanced'
layout = 'columns'
default-zone = 'main'
columns = [
  { id = 'left', name = 'Reference', width = 0.25 }, # preserve this comment
  { id = 'main', name = 'Work', width = 0.50 },
  { id = 'right', name = 'Comms', width = 0.25 },
]

[[zone-layouts]]
id = 'focus'
layout = 'columns'
default-zone = 'main'
columns = [
  { id = 'left', name = 'Reference', width = 0.15 },
  { id = 'main', name = 'Work', width = 0.70 },
  { id = 'right', name = 'Comms', width = 0.15 },
]

[[zones]]
monitor = 1
layout-preset = 'balanced'

[[zone-availability-sets]]
id = 'focus-only'
enabled-zones = ['main']

[[zone-availability-sets]]
id = 'full-dashboard'
enabled-zones = ['left', 'main', 'right']

[[zone-bindings]]
zone = 'left'
workspace = 'ReferenceDesk'

[[zone-affinities]]
zone = 'Comms'
if.window-title-regex-substring = 'save-comms'
fail-if-noop = true

[mouse.zone-snap]
policy = 'freeform'
modifier = 'alt'
gesture = 'drag'
target = 'zone'

[workspace-sidebar]
enabled = true
enable-focus = false
width = 260
collapsed-width = 64
show-date = false

[mode.main.binding]
alt-z = 'mode zone'

[mode.zone.binding]
s = 'save-zone-layout --dry-run'
shift-s = 'save-zone-layout'
esc = 'mode main'
