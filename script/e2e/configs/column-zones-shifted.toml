config-version = 2
auto-reload-config = false
persistent-workspaces = []

[[zones]]
monitor = 1
layout = 'columns'
default-zone = 'main'
columns = [
  { id = 'left', name = 'Reference', width = 0.20 },
  { id = 'main', name = 'Work', width = 0.60 },
  { id = 'right', name = 'Comms', width = 0.20 },
]

[workspace-sidebar]
enabled = false

[mode.main.binding]
alt-h = 'focus left'
alt-l = 'focus right'
