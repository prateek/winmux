config-version = 2
auto-reload-config = false
persistent-workspaces = []

[[zone-styles]]
id = 'urgent'
color = '#D3455B'

[[zone-styles]]
id = 'calm'
color = '#3EA2FF'

[[zone-layouts]]
id = 'balanced'
layout = 'columns'
default-zone = 'main'
columns = [
  { id = 'left', name = 'Reference', width = 0.25 },
  { id = 'main', name = 'Work', width = 0.50 },
  { id = 'right', name = 'Comms', width = 0.25 },
]

[[zones]]
monitor = 1
layout-preset = 'balanced'

[workspace-sidebar]
enabled = true
enable-focus = false
width = 260
collapsed-width = 64
show-date = false

[mode.main.binding]
alt-y = 'cycle-zone-style Comms urgent calm'
