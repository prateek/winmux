name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Swift toolchain
        run: |
          # Homebrew installs whichever swiftly its bottle cache holds, and 1.1.3 asks for
          # swift-6.4-RELEASE, which does not exist for 6.4.0. Pin swiftly itself.
          curl -fsSL -o "$RUNNER_TEMP/swiftly.pkg" https://download.swift.org/swiftly/darwin/swiftly-1.1.4.pkg
          echo "8cc1161d88d8869491393b739c1f5a5e3b02abc313dc6d4502571129441e2ef9  $RUNNER_TEMP/swiftly.pkg" | shasum -a 256 -c
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --skip-install --assume-yes --quiet-shell-followup --verbose
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          ~/.swiftly/bin/swiftly --version
          ~/.swiftly/bin/swiftly install

      - name: Record tool versions
        run: |
          source ./script/setup.sh
          swift --version
          xcodebuild -version

      - name: Build and test
        run: make check
