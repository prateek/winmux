# WinMux configuration (config-version 3).
#
# The surface is five nouns:
#   Display — a physical monitor. Shows one scene at a time.
#   Scene   — a named column arrangement a display switches between.
#   Column  — a vertical slice of a scene; behaves like its own small monitor.
#   Card    — a named window group. Lives in exactly one column's deck.
#   Rule    — a window match that deals a new window onto a card.
#
# A display with no [scene.*] block gets one implicit full-width column whose
# deck is all its cards. That is this file's default: classic card switching on
# a laptop, zero configuration. Uncomment the [scene.*] block near the bottom to
# split an ultrawide into columns. See docs/ultrawide-columns.md.

config-version = 3

start-at-login = false
auto-reload-config = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
tab-group-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

automatically-unhide-macos-hidden-apps = false
auto-add-new-windows-to-tab-group = false
shortcuts-preset = 'none'

# Cards listed here are never pruned, even when their windows all close.
persistent-cards = []

[key-mapping]
    preset = 'qwerty'

# In-card window tabbing (presentation only).
[window-tabs]
    enabled = true
    height = 36

[gaps]
    inner.horizontal = 8
    inner.vertical = 8
    outer.left = 8
    outer.bottom = 8
    outer.top = 8
    outer.right = 8

# The cross-scene map of every column, deck, and card.
[sidebar]
    enabled = true
    width = 240
    collapsed-width = 44
    show-status-pills = true
    show-date = true

[updates]
    automatic-check = false  # true = Sparkle checks the update feed in the background

[mouse]
    # Dividers grow drag handles only while the 'column' binding mode is active
    # ('column-mode'), so ordinary clicks never fight the window manager.
    # 'always' = draggable in every mode; 'off' = never draggable.
    column-divider-drag = 'column-mode'

[mouse.column-snap]
    # policy: float-unless-snap | freeform (never snap) | snap-on-modifier | snap-to-column
    policy = 'float-unless-snap'
    modifier = 'alt'
    gesture = 'secondary-button-drag'
    target = 'column'        # or 'window' for in-column slot snapping

# --- Ultrawide scenes and rules (commented; the default above is the laptop case)
#
# Uncomment the block between the markers below to split display 1 into columns,
# switch between three scenes, and deal chat/mail onto a Comms card.
# `display` selects the physical monitor: 1, 2 = left-to-right; 'main';
# 'secondary'; or a name pattern like 'LG-Ultrawide' (prefer names for stable
# multi-monitor setups). The first declared scene for a display is its default.
# `color` tints a column's chrome (divider, sidebar accent, expose border) and
# is purely cosmetic. Column widths must sum to 1.0. Column ids may not use the
# reserved direction words left/right/next/prev. Once uncommented, the
# alt-ctrl-1/2/3 scene bindings below light up.
#
# BEGIN WINMUX ULTRAWIDE SCENES EXAMPLE
# [scene.desk]
# display = 1
# default-column = 'main'
# columns = [
#   { id = 'ref',   name = 'Reference', width = 0.20, color = '#3EA2FF' },
#   { id = 'main',  name = 'Work',      width = 0.55 },
#   { id = 'comms', name = 'Comms',     width = 0.25, color = '#D3455B' },
# ]
#
# [scene.focus]
# display = 1
# columns = [ { id = 'main', name = 'Work', width = 1.0 } ]
#
# [scene.triage]
# display = 1
# default-column = 'comms'
# columns = [
#   { id = 'comms', name = 'Comms', width = 0.60, color = '#D3455B' },
#   { id = 'main',  name = 'Work',  width = 0.40 },
# ]
#
# [[rules]]
# if.app-id = 'com.tinyspeck.slackmacgap'
# card = 'Comms'
#
# [[rules]]
# if.window-title-regex-substring = 'Inbox|Mail'
# card = 'Comms'
# END WINMUX ULTRAWIDE SCENES EXAMPLE

[mode.main.binding]
    # Cards: page the focused column's deck. Positions are stable, so muscle
    # memory holds.
    alt-n = 'card next'
    alt-p = 'card prev'
    alt-tab = 'card back-and-forth'
    alt-1 = 'card 1'
    alt-2 = 'card 2'
    alt-3 = 'card 3'
    alt-4 = 'card 4'
    alt-5 = 'card 5'
    alt-6 = 'card 6'
    alt-7 = 'card 7'
    alt-8 = 'card 8'
    alt-9 = 'card 9'
    alt-0 = 'card 10'

    # Scenes: switch the focused display's column arrangement. These no-op until
    # you declare the matching [scene.*] blocks above (the ctrl layer avoids any
    # collision with the card positions).
    alt-ctrl-1 = 'scene desk'
    alt-ctrl-2 = 'scene focus'
    alt-ctrl-3 = 'scene triage'
    alt-ctrl-tab = 'scene next'

    # Window focus inside the focused card (upstream).
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Move the focused window inside its card.
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Send the focused window to a card by deck position.
    alt-shift-1 = 'move-node-to-card 1'
    alt-shift-2 = 'move-node-to-card 2'
    alt-shift-3 = 'move-node-to-card 3'
    alt-shift-4 = 'move-node-to-card 4'
    alt-shift-5 = 'move-node-to-card 5'

    # Send the focused window to the adjacent column.
    ctrl-shift-h = 'move-node-to-column left'
    ctrl-shift-l = 'move-node-to-column right'

    # In-card window layout.
    alt-space = 'layout tiles tab-group'
    alt-shift-space = 'layout floating tiling'
    alt-slash = 'layout horizontal vertical'
    alt-shift-m = 'fullscreen'
    cmd-shift-i = 'balance-sizes'

    # Exposé, sidebar, and modes. macOS's own Mission Control shortcuts may
    # shadow the two ctrl-arrow bindings; disable them in System Settings >
    # Keyboard > Shortcuts > Mission Control if nothing happens.
    ctrl-up = 'expose display'
    ctrl-down = 'expose card'
    ctrl-f = 'open-sidebar'
    alt-z = 'mode column'

[mode.column.binding]
    h = ['focus-column prev', 'mode main']
    l = ['focus-column next', 'mode main']
    shift-h = ['card move left', 'mode main']
    shift-l = ['card move right', 'mode main']
    minus = ['column resize -10%', 'mode main']
    equal = ['column resize +10%', 'mode main']
    "0" = ['balance-columns', 'mode main']
    t = ['column toggle', 'mode main']
    s = ['cycle-column-snap-policy float-unless-snap freeform', 'mode main']
    esc = 'mode main'
